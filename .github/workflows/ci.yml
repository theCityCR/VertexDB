name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -eu
          attempt=1
          max_attempts=5
          while true; do
            if cmake -S . -B build -DVERTEXDB_BUILD_TESTS=ON; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "cmake configure failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "cmake configure failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            rm -rf build
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run sanitizers
        run: scripts/run-sanitizers.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run coverage
        run: scripts/run-coverage.sh

  benchmark-shape:
    name: benchmark shape
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Fixture checks
        run: python3 scripts/check_benchmark_shape.py --self-test

      - name: CTE cost-shape gate
        run: |
          set -eu
          attempt=1
          max_attempts=3
          while true; do
            if scripts/run-benchmarks.sh --check-shape; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "benchmark shape gate failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "benchmark shape gate failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            rm -rf build-benchmark
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-shape-json
          path: build-benchmark/benchmark-shape.json
          if-no-files-found: ignore

  # Full illustrative table (slow: median-of-5, includes rollback / MATERIALIZED).
  # Does not run on ordinary push/PR. Trigger with workflow_dispatch once this job
  # exists on the default branch, or push a commit whose message contains
  # `[benchmark-report]`.
  benchmark-report:
    name: benchmark report
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark-report]'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Full report suite + shape check
        run: scripts/run-benchmarks.sh

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-json
          path: build-benchmark/benchmark-report.json
          if-no-files-found: error
